plugins { id 'com.android.application' }

android {
    namespace 'de.wattpit.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'de.wattpit.app'
        minSdk 26
        targetSdk 35
        versionCode 61
        versionName '1.6.12'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            if (System.getenv('WATTPIT_KEYSTORE')) {
                storeFile file(System.getenv('WATTPIT_KEYSTORE'))
                storePassword System.getenv('WATTPIT_SIGNING_PASSWORD')
                keyAlias 'wattpit'
                keyPassword System.getenv('WATTPIT_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('WATTPIT_KEYSTORE')) signingConfig signingConfigs.localRelease
        }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.0'
}
