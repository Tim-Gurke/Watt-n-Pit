name: Watt’n’Pit 1.3.6 signieren und veröffentlichen
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Mit bisheriger Signatur veröffentlichen (Signierungs-Secret erforderlich)'
        type: boolean
        required: true
        default: true
  push:
    branches: ['check/github-release-1.3.6']
permissions:
  contents: write
concurrency:
  group: wattpit-release-1.3.6
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: fbe145e09e3bdd0dc699b94a585363cd561b2cf3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Freigegebene APK und erfolgreichen Build prüfen
        run: |
          python3 -m py_compile tools/github-release-1.3.6.py
          python3 tools/github-release-1.3.6.py
      - name: Mit dem bisherigen privaten Schlüssel signieren
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          SIGNING_BACKUP_BASE64: ${{ secrets.WATTPIT_SIGNING_BACKUP_BASE64 }}
        run: python3 tools/github-release-1.3.6.py --sign
      - name: Geprüften Quellstand übernehmen
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git merge --no-ff "$SOURCE_SHA" -m "Release Watt’n’Pit 1.3.6 [skip ci]"
          git diff --exit-code "$SOURCE_SHA" -- app build.gradle settings.gradle gradle.properties gradle gradlew
          git push origin HEAD:main
      - name: Signierte APK veröffentlichen
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/wattpit-release-1.3.6"
          gh release create v1.3.6 "$release_dir/Watt-n-Pit-v1.3.6.apk" "$release_dir/SHA256SUMS.txt" \
            --target "$SOURCE_SHA" --title "Watt’n’Pit 1.3.6" --notes-file docs/releases/1.3.6.md
          gh release view v1.3.6 --json url,assets
      - name: Nur die drei neuesten Releases behalten
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | [.published_at, .tag_name] | @tsv' \
            | sort -r | tail -n +4 | cut -f2 > "$RUNNER_TEMP/old-wattpit-releases.txt"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            gh release delete --yes -- "$tag"
          done < "$RUNNER_TEMP/old-wattpit-releases.txt"
