name: Android 1.3.1 vorbereiten
on:
  push:
    branches: ['build/watt-1.3.1']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: JavaScript prüfen
        run: node --test tools/dashboard-core.test.cjs tools/equipment-core.test.cjs tools/settings-backup.test.cjs tools/tile-detail.test.cjs tools/read-bridge.test.cjs
      - name: Tests, Lint und Android-Build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Öffentliche Builddateien für lokale Signierung bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          api_base = 'https://api.github.com/repos/' + repo
          def api(path, payload):
              request = urllib.request.Request(api_base + path, data=json.dumps(payload).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'
              }, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          tools = sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').iterdir(), key=lambda p: tuple(int(x) for x in p.name.split('.') if x.isdigit()))[-1]
          apk = pathlib.Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "name='de.wattpit.app'" in badging and "versionName='1.3.1'" in badging and "versionCode='21'" in badging
          entries, manifest = [], {'source': source, 'files': {}, 'badging': badging}
          for label, path in {'unsigned.apk': apk, 'apksigner.jar': tools/'lib/apksigner.jar'}.items():
              data = path.read_bytes()
              encoded = base64.b64encode(data).decode()
              parts = []
              for i, offset in enumerate(range(0, len(encoded), 60000)):
                  name = 'build-output/' + label + '/' + str(i).zfill(3) + '.txt'
                  blob = api('/git/blobs', {'content': encoded[offset:offset+60000], 'encoding': 'utf-8'})
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
                  parts.append(name)
              manifest['files'][label] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'parts': parts}
          entries.append({'path': 'build-output/manifest.json', 'mode': '100644', 'type': 'blob', 'content': json.dumps(manifest)})
          tree = api('/git/trees', {'tree': entries})
          commit = api('/git/commits', {'message': 'Public unsigned Android 1.3.1 build files', 'tree': tree['sha'], 'parents': [os.environ['GITHUB_SHA']]})
          branch = 'artifacts/watt-1.3.1-' + source[:12]
          api('/git/refs', {'ref': 'refs/heads/' + branch, 'sha': commit['sha']})
          print('BUILD_OUTPUT_BRANCH=' + branch)
          print('SOURCE_COMMIT=' + source)
          print('Build files contain no private signing material.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pruefberichte-1.3.1
          path: app/build/reports/
