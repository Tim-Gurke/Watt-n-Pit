name: Android 1.3.6 vorbereiten
on:
  push:
    branches: ['build/watt-1.3.6']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: JavaScript prüfen
        run: node --test tools/dashboard-core.test.cjs tools/equipment-core.test.cjs tools/settings-backup.test.cjs tools/tile-detail.test.cjs tools/read-bridge.test.cjs
      - name: Tests, Lint und Android-Build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Archivbedarf, Neustart und atomare Speicherung prüfen
        run: |
          deps="$RUNNER_TEMP/wattpit-proof-deps"
          mkdir -p "$deps"
          curl --fail --location --retry 2 --max-time 120 https://repo.maven.apache.org/maven2/org/xerial/sqlite-jdbc/3.46.1.0/sqlite-jdbc-3.46.1.0.jar -o "$deps/sqlite-jdbc-3.46.1.0.jar"
          curl --fail --location --retry 2 --max-time 120 https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar -o "$deps/slf4j-api-1.7.36.jar"
          curl --fail --location --retry 2 --max-time 120 https://repo.maven.apache.org/maven2/org/robolectric/android-all/15-robolectric-12468137/android-all-15-robolectric-12468137.jar -o "$deps/android-api35.jar"
          python3 tools/prove-archive-delta.py --output app/build/reports/archive-delta-proof --sqlite-jar "$deps/sqlite-jdbc-3.46.1.0.jar" --slf4j-jar "$deps/slf4j-api-1.7.36.jar"
          python3 tools/prove-archive-storage.py --output app/build/reports/archive-storage-proof --android-jar "$deps/android-api35.jar" --sqlite-jar "$deps/sqlite-jdbc-3.46.1.0.jar" --slf4j-jar "$deps/slf4j-api-1.7.36.jar"
      - name: Native Abdeckung in allen Kurven prüfen
        env:
          WATTPIT_CHROMIUM: /usr/bin/google-chrome
          WATTPIT_COVERAGE_FIXTURE: ${{ runner.temp }}/coverage-fixture.json
          WATTPIT_SCREENSHOT_DIR: app/build/reports/sync-coverage
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/wattpit-ui" playwright@1.51.1
          mkdir -p "$RUNNER_TEMP/wattpit-java"
          classes=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          javac -cp "$classes" -d "$RUNNER_TEMP/wattpit-java" tools/SyncCoverageFixture.java
          java -cp "$RUNNER_TEMP/wattpit-java:$classes" de.wattpit.app.core.SyncCoverageFixture > "$WATTPIT_COVERAGE_FIXTURE"
          export NODE_PATH="$RUNNER_TEMP/wattpit-ui/node_modules"
          node tools/sync-coverage-smoke.cjs
          node tools/energy-balance-smoke.cjs
          node tools/tile-detail-smoke.cjs
      - name: Öffentliche Builddateien für lokale Signierung bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, xml.etree.ElementTree as ET
          repo = os.environ['GITHUB_REPOSITORY']
          api_base = 'https://api.github.com/repos/' + repo
          def api(path, payload):
              request = urllib.request.Request(api_base + path, data=json.dumps(payload).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'
              }, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          tools = sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').iterdir(), key=lambda p: tuple(int(x) for x in p.name.split('.') if x.isdigit()))[-1]
          apk = pathlib.Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "name='de.wattpit.app'" in badging and "versionName='1.3.6'" in badging and "versionCode='26'" in badging
          reports = [ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('*.xml')]
          assert reports and all(int(r.get('failures', 0)) == 0 and int(r.get('errors', 0)) == 0 for r in reports)
          entries, manifest = [], {'source': source, 'files': {}, 'badging': badging, 'jvm_tests': sum(int(r.get('tests', 0)) for r in reports)}
          for label, path in {'unsigned.apk': apk, 'sync-complete.png': pathlib.Path('app/build/reports/sync-coverage/sync-complete.png'), 'sync-real-gap.png': pathlib.Path('app/build/reports/sync-coverage/sync-real-gap.png')}.items():
              data = path.read_bytes()
              encoded = base64.b64encode(data).decode()
              parts = []
              for i, offset in enumerate(range(0, len(encoded), 60000)):
                  name = 'build-output/' + label + '/' + str(i).zfill(3) + '.txt'
                  blob = api('/git/blobs', {'content': encoded[offset:offset+60000], 'encoding': 'utf-8'})
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
                  parts.append(name)
              manifest['files'][label] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'parts': parts}
          entries.append({'path': 'build-output/manifest.json', 'mode': '100644', 'type': 'blob', 'content': json.dumps(manifest)})
          tree = api('/git/trees', {'tree': entries})
          commit = api('/git/commits', {'message': 'Public unsigned Android 1.3.6 build files', 'tree': tree['sha'], 'parents': [os.environ['GITHUB_SHA']]})
          branch = 'artifacts/watt-1.3.6-' + source[:12]
          api('/git/refs', {'ref': 'refs/heads/' + branch, 'sha': commit['sha']})
          print('BUILD_OUTPUT_BRANCH=' + branch)
          print('SOURCE_COMMIT=' + source)
          print('Build files contain no private signing material.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pruefberichte-1.3.6
          path: app/build/reports/
