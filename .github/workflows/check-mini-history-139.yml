name: Verlaufslayout 1.3.9 prüfen
on:
  push:
    branches: ['check/mini-history-1.3.9']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser einrichten
        run: npm install --no-save --prefix "$RUNNER_TEMP/wattpit-ui" playwright@1.51.1
      - name: Unveränderte App mit stabiler Layoutmessung dreimal prüfen
        env:
          WATTPIT_CHROMIUM: /usr/bin/google-chrome
          WATTPIT_LAYOUT_DIAGNOSTICS: '1'
        run: |
          export NODE_PATH="$RUNNER_TEMP/wattpit-ui/node_modules"
          for attempt in 1 2 3; do
            echo "LAYOUT_PROBE_ATTEMPT=$attempt"
            node tools/mini-history-smoke.cjs
          done
