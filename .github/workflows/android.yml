name: Android prüfen und veröffentlichen

on:
  push:
    branches: [main, 'publish/*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Dashboard-Berechnungen und Konfiguration prüfen
        run: node --test tools/dashboard-core.test.cjs tools/equipment-core.test.cjs tools/settings-backup.test.cjs tools/tile-detail.test.cjs tools/read-bridge.test.cjs
      - name: Tests, Lint und Android-Build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Archivbedarf, Neustart und atomare Speicherung prüfen
        run: |
          deps="$RUNNER_TEMP/wattpit-proof-deps"
          mkdir -p "$deps"
          curl --fail --location --retry 2 --max-time 120 https://repo.maven.apache.org/maven2/org/xerial/sqlite-jdbc/3.46.1.0/sqlite-jdbc-3.46.1.0.jar -o "$deps/sqlite-jdbc-3.46.1.0.jar"
          curl --fail --location --retry 2 --max-time 120 https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar -o "$deps/slf4j-api-1.7.36.jar"
          curl --fail --location --retry 2 --max-time 120 https://repo.maven.apache.org/maven2/org/robolectric/android-all/15-robolectric-12468137/android-all-15-robolectric-12468137.jar -o "$deps/android-api35.jar"
          python3 tools/prove-archive-delta.py --output app/build/reports/archive-delta-proof --sqlite-jar "$deps/sqlite-jdbc-3.46.1.0.jar" --slf4j-jar "$deps/slf4j-api-1.7.36.jar"
          python3 tools/prove-archive-storage.py --output app/build/reports/archive-storage-proof --android-jar "$deps/android-api35.jar" --sqlite-jar "$deps/sqlite-jdbc-3.46.1.0.jar" --slf4j-jar "$deps/slf4j-api-1.7.36.jar"
          python3 tools/prove-archive-foreground.py --dependencies "$deps" --output app/build/reports/archive-foreground-proof --mode fixed
      - name: Native Abdeckung in allen Kurven prüfen
        env:
          WATTPIT_CHROMIUM: /usr/bin/google-chrome
          WATTPIT_COVERAGE_FIXTURE: ${{ runner.temp }}/coverage-fixture.json
          WATTPIT_SCREENSHOT_DIR: app/build/reports/sync-coverage
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/wattpit-ui" playwright@1.51.1
          mkdir -p "$RUNNER_TEMP/wattpit-java"
          classes=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          javac -cp "$classes" -d "$RUNNER_TEMP/wattpit-java" tools/SyncCoverageFixture.java
          java -cp "$RUNNER_TEMP/wattpit-java:$classes" de.wattpit.app.core.SyncCoverageFixture > "$WATTPIT_COVERAGE_FIXTURE"
          export NODE_PATH="$RUNNER_TEMP/wattpit-ui/node_modules"
          node tools/sync-coverage-smoke.cjs
          node tools/energy-balance-smoke.cjs
          node tools/tile-detail-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Watt-n-Pit-CI-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pruefberichte
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/sync-coverage/
            app/build/reports/archive-delta-proof/report.json
            app/build/reports/archive-delta-proof/*.requests.tsv
            app/build/reports/archive-storage-proof/report.json
            app/build/reports/archive-storage-proof/results.log
            app/build/reports/archive-foreground-proof/

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/publish/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Vorbereitete signierte APK prüfen und Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          apk=".release/Watt-n-Pit-v${version}.apk"
          test -f "$apk"
          # The publication commit may attach APK/checksum files only.
          test -z "$(git diff HEAD^ HEAD --name-only | sed '/^\.release\//d')"
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          certificate=$("$tools_dir/apksigner" verify --print-certs "$apk")
          [[ "$certificate" == *"certificate SHA-256 digest: 0e6e04bc2b50990a8f28bebae31dea596c2cd2f8563f1505aaaafc07277faeb2"* ]]
          badging=$("$tools_dir/aapt" dump badging "$apk")
          [[ "$badging" == *"name='de.wattpit.app'"* ]]
          [[ "$badging" == *"versionName='${version}'"* ]]
          sha256sum "$apk" | sed 's|.release/||' > ".release/SHA256SUMS.txt"
          gh release create "v${version}" "$apk" .release/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD^)" --title "Watt’n’Pit ${version}" \
            --notes-file "docs/releases/${version}.md"
      - name: Nur die drei neuesten Releases behalten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GH_REPO}/releases" \
            --jq '.[] | select(.draft == false) | [.published_at, .tag_name] | @tsv' \
            | sort -r | tail -n +4 | cut -f2 > "$RUNNER_TEMP/old-releases.txt"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            gh release delete --yes -- "$tag"
          done < "$RUNNER_TEMP/old-releases.txt"
